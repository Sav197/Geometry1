<noscript><p style="padding:24px">Для роботи ГеоКвесту потрібен браузер або HTML-переглядач з увімкненим JavaScript. Інтернет не потрібен.</p></noscript>
<script>
'use strict';
/* GEOMETRY_DATA */
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const vec=s=>`<span class="vec">${s}</span>`;
const form=s=>`<div class="formula math">${s}</div>`;
const note=s=>`<div class="note">${s}</div>`;
const peach=s=>`<div class="note peach">${s}</div>`;
const slide=(title,html,extra={})=>({title,html,...extra});
const TOPICS=[{id:'v',title:'Вектори на площині',short:'Вектори',subtitle:'Напрям, координати, дії та кути',color:'vector'},{id:'t',title:'Розв’язування трикутників',short:'Трикутники',subtitle:'Синуси, косинуси, площі та відстані',color:'triangle'}];
const UNITS=[
{id:'v1',topic:'v',title:'Знайомство з вектором',time:6,slides:[
 slide('Не лише скільки, а й куди',`<p><b>Вектор — напрямлений відрізок.</b> У ${vec('AB')} точка A — початок, B — кінець. Наприклад, «4 кроки праворуч» — це переміщення з довжиною та напрямом.</p>${note('Точка показує місце. Вектор показує, як змінюється положення.')}`,{graphic:'vectors'}),
 slide('Рівні та протилежні',`<p><b>Рівні вектори</b> мають однакову довжину та однаковий напрям. Вони можуть починатися в різних точках.</p><p><b>Протилежний вектор</b> −${vec('a')} має таку саму довжину, але протилежний напрям.</p>${peach('Паралельності замало для рівності: довжини та напрями теж мають збігатися.')}`),
 slide('Нульовий і одиничний',`<p>Нульовий вектор має координати <b>(0; 0)</b> і довжину 0. Його початок та кінець збігаються; визначеного напряму немає.</p><p>Одиничний вектор має довжину <b>1</b>.</p><p>Маса й площа — скалярні величини. Переміщення та сила — векторні.</p>${note('Поясни вголос: чим відрізняються «5 метрів» і «5 метрів на північ»?')}`)
]},
{id:'v2',topic:'v',title:'Координати й довжина',time:8,slides:[
 slide('Кінець мінус початок',`<p>Для A(x<sub>A</sub>; y<sub>A</sub>) і B(x<sub>B</sub>; y<sub>B</sub>):</p>${form(`${vec('AB')} = (x<sub>B</sub> − x<sub>A</sub>; y<sub>B</sub> − y<sub>A</sub>)`)}<p>Від A(−2; 1) до B(4; 5):</p>${form(`${vec('AB')} = (4 − (−2); 5 − 1) = (6; 4)`)}${note('Для обох координат зберігай однаковий порядок віднімання.')}`,{graphic:'coordinates'}),
 slide('Довжина за Піфагором',`<p>Якщо ${vec('a')} = (x; y), то:</p>${form(`|${vec('a')}| = √(x² + y²)`)}<p>Для (−3; 4):</p>${form('√((−3)² + 4²) = √25 = 5')}<p>Мінус у координаті позначає напрям. Після піднесення до квадрата він зникає.</p>`),
 slide('Зворотний вектор та кінець',`${form(`${vec('BA')} = −${vec('AB')}`)}<p>Якщо ${vec('AB')} = (6; 4), то ${vec('BA')} = (−6; −4). Довжини однакові.</p><p>Якщо початок P(1; −3), а ${vec('PQ')} = (4; 6), координати кінця отримуємо додаванням:</p>${form('Q = (1 + 4; −3 + 6) = (5; 3)')}`)
]},

{id:'v6',topic:'v',title:'Вектори в задачах',time:9,slides:[

{id:'t1',topic:'t',title:'Кути, сторони та тригонометрія',time:8,slides:[
 slide('Кожному куту — протилежна сторона',`<p>Домовимося: <b>a = BC, b = CA, c = AB</b>; α — кут A, β — кут B, γ — кут C.</p>${form('α + β + γ = 180°')}<p>Розв’язати трикутник — знайти <b>всі невідомі сторони та кути</b>.</p>${note('Більшій стороні відповідає більший кут. Сума двох менших сторін має бути більшою за найбільшу.')}`,{graphic:'triangle'}),

{id:'t2',topic:'t',title:'Теорема косинусів',time:10,slides:[

{id:'t3',topic:'t',title:'Теорема синусів',time:10,slides:[

{id:'t4',topic:'t',title:'Площі та радіуси кіл',time:9,slides:[

 slide('Формула Герона',`<p>Коли відомі три сторони:</p>${form('p = (a + b + c) / 2')}${form('S = √[p(p − a)(p − b)(p − c)]')}<p>Для 13, 14, 15 маємо p = 21:</p>${form('S = √(21 · 8 · 7 · 6) = 84')}${note('p — півпериметр. Перед обчисленнями перевір, чи існує трикутник.')}`),
 slide('Вписане та описане кола',`${form('S = pr, &nbsp; S = abc / (4R)')}${form('r = S / p, &nbsp; R = abc / (4S)')}<p>Для сторін 13, 14, 15: S = 84, p = 21. Тому <b>r = 4</b>, <b>R = 65/8 = 8,125</b>.</p>${peach('Довжини записуй у см, площі — у см². Великою R позначаємо радіус описаного кола, малою r — вписаного.')}`)

{id:'t5',topic:'t',title:'Обираємо спосіб і перевіряємо',time:10,slides:[

]},
{id:'t6',topic:'t',title:'Геометрія навколо нас',time:9,slides:[
 slide('Відстань через річку',`<p>На березі AB = 50 м. Дерево C видно під кутами A = 45°, B = 60°. Тоді C = 75°.</p>${form('AC = 50 · sin 60° / sin 75° ≈ 44,83 м')}${form('BC = 50 · sin 45° / sin 75° ≈ 36,60 м')}<p>Недоступну відстань знайшли через доступну основу та два кути.</p>`),

]}

function today(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function previousDay(s){const [y,m,d]=s.split('-').map(Number);return today(new Date(y,m-1,d-1));}

// Numeric expression parser. No eval, Function, scripts or network calls.
function parseNumber(input){
 const s=String(input).trim().toLowerCase().replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s/g,'').replace(/²/g,'^2');
 if(!s||s.length>80)return NaN;
 const tokens=[];let pos=0,depth=0;
 while(pos<s.length){const m=s.slice(pos).match(/^(sqrt|√|pi|π|\d+(?:\.\d*)?|\.\d+|[+\-*/^()])/);if(!m)return NaN;tokens.push(m[0]);pos+=m[0].length;}
 let i=0;
 function atom(){
  if(++depth>25)throw Error('depth');
  let value;const t=tokens[i++];
  if(t==='('){value=expression();if(tokens[i++]!==')')throw Error('parenthesis');}
  else if(t==='sqrt'||t==='√'){value=Math.sqrt(unary());}
  else if(t==='pi'||t==='π')value=Math.PI;
  else if(t!==undefined&&/^(\d|\.)/.test(t))value=Number(t);
  else throw Error('number');
  depth--;return value;
 }
 function power(){let value=atom();if(tokens[i]==='^'){i++;const e=unary();if(Math.abs(e)>12)throw Error('power');value=Math.pow(value,e);}return value;}
 function unary(){if(tokens[i]==='+'){i++;return unary();}if(tokens[i]==='-'){i++;return -unary();}return power();}

function renderReview(){const due=dueQuestions(),seen=BANK.filter(q=>STATE.cards[q.id]?.attempts),future=seen.map(q=>STATE.cards[q.id].due).filter(t=>t>Date.now());$('#main').innerHTML=`<p class="eyebrow">Поверни знання в пам’ять</p><h1>Повторення</h1><p class="sub">Після правильної відповіді без підказки завдання повернеться через 1, 3, 7 або 14 днів. Помилки — одразу.</p><div class="card" style="margin-top:22px">${due.length?`<div class="between"><div><h2>${due.length} ${due.length===1?'завдання':'завдань'}</h2><p class="meta">готові до повторення</p></div><span class="goal-icon">↻</span></div><button class="btn full" style="margin-top:18px" data-action="quiz" data-mode="review">Повторити ${Math.min(due.length,8)} завдань</button>`:`<div class="empty"><div class="emoji">✦</div><h2>${seen.length?'На сьогодні все!':'Тут з’являться твої повторення'}</h2><p class="sub">${seen.length?'Можеш попрацювати з новим уроком або пройти коротке закріплення.':'Виконай перше тренування. Додаток запам’ятає, до яких завдань повернутися.'}</p>${future.length?`<p class="fine">Найближче повторення — ${new Date(Math.min(...future)).toLocaleDateString('uk-UA',{day:'numeric',month:'long'})}.</p>`:''}</div><button class="btn full" data-action="quiz" data-mode="daily">Коротке закріплення</button>`}</div>${due.length?`<div class="section-top"><h2>Над чим попрацювати</h2></div><div class="card">${due.slice(0,6).map(q=>`<div class="review-item"><span class="review-dot">${STATE.cards[q.id].lastWrong?'!':'↻'}</span><div><strong>${UNITS.find(u=>u.id===q.unit).title}</strong><div class="meta">${esc(q.text.length>85?q.text.slice(0,83)+'…':q.text)}</div></div></div>`).join('')}</div>`:''}<p class="fine center">Для наступного повторення відкрий цей файл іншого дня.</p>`;}
function renderProgress(){const s=overallStats(),streak=currentStreak();$('#main').innerHTML=`<p class="eyebrow">Крок за кроком</p><h1>Твій прогрес</h1><p class="sub">Результати зберігаються на пристрої в цьому браузері.</p><div class="stat-grid"><div class="stat"><strong style="color:var(--purple)">${s.known}</strong><span>розв’язано з 72</span></div><div class="stat"><strong style="color:var(--mint)">${s.accuracy}%</strong><span>точність усіх спроб</span></div><div class="stat"><strong style="color:#d58937">${streak}</strong><span>днів поспіль</span></div></div><div class="card"><h3>Навчальні маршрути</h3>${TOPICS.map(t=>{const st=topicStats(t.id);return `<div style="margin-top:17px"><div class="between small"><strong>${t.short}</strong><span>${st.percent}%</span></div><div class="progress ${t.id==='t'?'mint':''}"><i style="width:${st.percent}%"></i></div><p class="fine">${st.done} із 6 мініуроків завершено</p></div>`}).join('')}</div><div class="card"><h3>Що вже опрацьовано</h3>${UNITS.map(u=>{const st=unitStats(u.id);return `<div class="review-item"><span style="color:${st.done?'var(--mint)':'#bdb4ce'};font-size:21px">${st.done?'✓':'○'}</span><div style="flex:1"><strong>${u.title}</strong><p class="meta">${st.read?'Теорія ✓':'Теорія —'} · практика ${Math.min(st.mastered,4)}/4</p><div class="mini-track"><i style="width:${st.percent}%"></i></div></div></div>`}).join('')}</div><div class="card"><h3>Зберегти й перенести</h3><p class="sub">Експортуй прогрес, щоб мати копію або перенести навчання в інший браузер.</p><div class="split-actions"><button class="btn secondary sm" data-action="export">Експортувати</button><button class="btn ghost sm" data-action="import">Імпортувати</button></div>${!storageOK?'<p class="storage-note">У цьому режимі браузер не зберігає прогрес після закриття. Скористайся експортом.</p>':''}</div><button class="btn full ghost" data-action="help">Запуск, звук і налаштування</button>`;}
function renderHelp(){$('#main').innerHTML=`${back('Допомога та налаштування')}<div class="card"><h2>Один файл — увесь додаток</h2><div class="help-item"><strong>1. Збережи index.html на телефоні</strong>У файлі вже є теорія, завдання, формули та інтерактивні малюнки.</div><div class="help-item"><strong>2. Відкрий файл у браузері</strong>Обери браузер або HTML-переглядач, який виконує JavaScript. Після завантаження файлу додаток працює без інтернету.</div><div class="help-item"><strong>3. Повертайся до того самого файлу</strong>Прогрес прив’язаний до браузера. Перед перенесенням файлу чи зміною браузера експортуй результати.</div></div><div class="card"><h3>Під час навчання</h3><div class="settings-row"><span>Звуки відповідей</span><button class="toggle ${STATE.sound?'on':''}" data-action="sound" role="switch" aria-checked="${STATE.sound}" aria-label="Звуки відповідей"><i></i></button></div><p class="fine">Короткі сигнали створюються на пристрої. За замовчуванням звук вимкнено.</p><div class="help-item"><strong>Як вводити відповіді</strong>Десятковий дріб: 0,5 або 0.5. Звичайний дріб: 1/2. Корінь: √19, sqrt(19), 2√19. Кнопка √ з’являється біля числових полів. Кути вводь у градусах.</div><div class="help-item"><strong>За що дають XP</strong>Теорія — 15 XP одноразово за урок. Перша правильна відповідь — 10 XP, із підказкою — 5. Повторення — 3 або 2 XP, не частіше одного разу за завдання на день.</div><div class="help-item"><strong>Що означає завершений урок</strong>Теорія опрацьована та принаймні 4 різні задачі з 6 розв’язано правильно. Для повторення без підказки завдання повертаються через 1, 3, 7 і 14 днів.</div></div><div class="card"><h3>Програмна основа</h3><p class="sub">9 клас НУШ: вектори на площині та розв’язування трикутників. Використано підготовлені матеріали занять, включно з виведеннями теорем.</p><p class="external" style="margin-top:12px"><a href="https://mon.gov.ua/static-objects/mon/sites/1/zagalna%20serednya/Navchalni.prohramy/2023/Model.navch.prohr.5-9.klas/Matem.osv.galuz-2023/Heometriya.7-9%20kl.Ister.26.07.2023.pdf" target="_blank" rel="noopener">Модельна програма О. С. Істера на сайті МОН ↗</a></p><p class="fine">Посилання на джерело потребує інтернету. Для навчання в додатку воно не потрібне.</p></div><button class="btn full ghost" data-action="reset">Очистити навчальний прогрес</button><p class="fine center">ГеоКвест · версія 1.0 · для Семена та спільних занять</p>`;}

/* LAB_AND_DIAGRAM_VIEWS */

function arrowDefs(){return '<defs><marker id="vp" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7357e8"/></marker><marker id="vo" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#e78d4d"/></marker><marker id="vg" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#21a881"/></marker></defs>';}
function line(x1,y1,x2,y2,color,extra=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" ${extra.includes('stroke-width=')?'':'stroke-width="2.5"'} stroke-linecap="round" ${extra}/>`;}
function svgt(x,y,text,color='#625973',size=12,extra=''){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-family="system-ui,sans-serif" ${extra}>${text}</text>`;}
function smallGraphic(kind){
 if(kind==='triangle')return proofDiagram(1,'sin');
 if(kind==='addition')return `<svg class="proof-diagram" viewBox="0 0 400 250" role="img" aria-label="Додавання векторів за правилами трикутника й паралелограма">${arrowDefs()}${line(55,210,230,175,'#7357e8','marker-end="url(#vp)"')}${line(55,210,115,65,'#e78d4d','marker-end="url(#vo)"')}${line(230,175,290,30,'#e78d4d','stroke-dasharray="5 5" marker-end="url(#vo)"')}${line(115,65,290,30,'#7357e8','stroke-dasharray="5 5" marker-end="url(#vp)"')}${line(55,210,290,30,'#21a881','marker-end="url(#vg)"')}${svgt(40,229,'A')}${svgt(236,191,'B')}${svgt(295,29,'C')}${svgt(96,60,'D')}${svgt(148,216,'a','#7357e8',17)}${svgt(55,120,'b','#d1793a',17)}${svgt(173,92,'a + b','#198363',16)}</svg>`;
 if(kind==='coordinates'){let grid='';for(let n=-3;n<=6;n++){const x=145+n*25;grid+=line(x,20,x,225,'#ebe5f2','stroke-width="1"');}for(let n=-1;n<=6;n++){const y=190-n*25;grid+=line(60,y,315,y,'#ebe5f2','stroke-width="1"');}return `<svg class="proof-diagram" viewBox="0 0 400 250" role="img" aria-label="Вектор від A мінус 2 і 1 до B 4 і 5">${arrowDefs()}${grid}${line(60,190,325,190,'#b3a7c6')}${line(145,225,145,15,'#b3a7c6')}${line(95,165,245,65,'#7357e8','marker-end="url(#vp)"')}<circle cx="95" cy="165" r="4" fill="#7357e8"/>${svgt(64,183,'A(−2; 1)')}${svgt(252,63,'B(4; 5)')}${svgt(185,111,'(6; 4)','#7357e8',15)}${svgt(133,207,'0')}${svgt(327,194,'x')}${svgt(154,22,'y')}</svg>`;}
 return `<svg class="proof-diagram" viewBox="0 0 400 190" role="img" aria-label="Рівні вектори в різних місцях площини">${arrowDefs()}${line(45,135,155,45,'#7357e8','marker-end="url(#vp)"')}${line(215,155,325,65,'#21a881','marker-end="url(#vg)"')}${svgt(25,155,'A')}${svgt(161,42,'B')}${svgt(199,176,'C')}${svgt(329,63,'D')}${svgt(116,178,'AB = CD','#7357e8',17)}</svg>`;
}
function proofDiagram(stage,type){const A=[45,190],B=[355,190],C=[160,25],H=[160,190];const h=stage>=1;let content=`<path d="M45 190 355 190 160 25Z" fill="#f5f1ff" stroke="#7357e8" stroke-width="2.6"/>${svgt(23,207,'A')}${svgt(365,207,'B')}${svgt(155,17,'C')}${svgt(79,102,'b','#7357e8',18)}${svgt(270,96,'a','#7357e8',18)}${svgt(194,236,'c','#7357e8',17)}<path d="M75 190A30 30 0 0 0 62 165M325 190A30 30 0 0 1 331 171" fill="none" stroke="#a79abb"/>${svgt(81,176,'α','#62527d',16)}${svgt(306,177,'β','#62527d',16)}`;if(h)content+=`${line(...C,...H,'#dc975b','stroke-dasharray="6 5"')}<path d="M160 177h13v13" fill="none" stroke="#dc975b" stroke-width="1.5"/>${svgt(171,117,'h','#bc7a3e',17)}${svgt(155,211,'H')}`;if(h&&(stage>=2||type==='cos'))content+=`${svgt(96,211,'x','#bc7a3e',14)}${svgt(240,211,'c − x','#bc7a3e',14)}`;return `<svg class="proof-diagram" viewBox="0 0 400 250" role="img" aria-label="Трикутник ABC${h?' з висотою CH':''}; a навпроти α, b навпроти β, c навпроти γ">${content}</svg>`;}
function proofView(type){const steps=PROOFS[type],i=clamp(UI.proofStep,0,steps.length-1),s=steps[i];return `${proofDiagram(i,type)}<div class="proof-progress">Крок ${i+1} із ${steps.length}</div><div class="proof-step"><h3>${s[0]}</h3><p>${s[1]}</p>${form(s[2])}</div><div class="proof-buttons"><button class="btn secondary sm" data-action="proofPrev" ${i===0?'disabled':''}>← Крок</button><button class="btn sm" data-action="proofNext" ${i===steps.length-1?'disabled':''}>Крок →</button></div>${i===steps.length-1?note(type==='cos'?'Косинуси: двічі застосовуємо Піфагора.':'Синуси: виражаємо одну висоту двома способами.'):''}`;}

function vectorExtent(){if(UI.drag)return UI.drag.extent;const info=vectorInfo(UI.a,UI.b),r=UI.vectorMode==='diff'?info.diff:info.sum;return Math.max(6,...UI.a.map(Math.abs),...UI.b.map(Math.abs),...(UI.vectorMode==='dot'?[]:r.map(Math.abs)))+1;}
function vectorSVG(){const a=UI.a,b=UI.b,info=vectorInfo(a,b),e=vectorExtent(),scale=140/e,ox=200,oy=164,pt=p=>[ox+p[0]*scale,oy-p[1]*scale];let grid='';for(let k=-Math.floor(e);k<=e;k++){const x=ox+k*scale,y=oy-k*scale;grid+=`<line x1="${x}" y1="24" x2="${x}" y2="304" stroke="#ece6f5"/><line x1="60" y1="${y}" x2="340" y2="${y}" stroke="#ece6f5"/>`;if(k&&((e>8&&k%2===0)||e<=8)){grid+=svgt(x,oy+15,String(k),'#a598b6',9,'text-anchor="middle"');grid+=svgt(ox-8,y+3,String(k),'#a598b6',9,'text-anchor="end"');}}
 const [ax,ay]=pt(a),[bx,by]=pt(b);let arrows='';if(Math.hypot(...a)>0)arrows+=line(ox,oy,ax,ay,'#7357e8','marker-end="url(#vp)"');if(Math.hypot(...b)>0)arrows+=line(ox,oy,bx,by,'#e78d4d','marker-end="url(#vo)"');
 if(UI.vectorMode!=='dot'){const r=UI.vectorMode==='diff'?info.diff:info.sum,[rx,ry]=pt(r);if(Math.hypot(...r)>0)arrows+=line(ox,oy,rx,ry,'#21a881','marker-end="url(#vg)"');arrows+=line(ax,ay,rx,ry,UI.vectorMode==='diff'?'#b2998b':'#e78d4d','stroke-dasharray="4 5"');arrows+=svgt(clamp(rx+9,22,355),clamp(ry-9,18,315),UI.vectorMode==='diff'?'a − b':'a + b','#19896c',12);}
 else if(info.angle!==null){const ta=Math.atan2(-a[1],a[0]),tb=Math.atan2(-b[1],b[0]);let delta=tb-ta;while(delta>Math.PI)delta-=2*Math.PI;while(delta<-Math.PI)delta+=2*Math.PI;const r=31,x1=ox+r*Math.cos(ta),y1=oy+r*Math.sin(ta),x2=ox+r*Math.cos(ta+delta),y2=oy+r*Math.sin(ta+delta);arrows+=`<path d="M${x1} ${y1}A${r} ${r} 0 0 ${delta>=0?1:0} ${x2} ${y2}" stroke="#21a881" stroke-width="2" fill="none"/>`;}
 const handle=(x,y,key,color)=>`<circle cx="${x}" cy="${y}" r="30" fill="${color}" fill-opacity=".055" data-drag="${key}"/><circle cx="${x}" cy="${y}" r="6" fill="${color}" stroke="white" stroke-width="2" data-drag="${key}"/>`;
 return `<svg class="lab-svg" id="vectorSvg" viewBox="0 0 400 330" role="img" aria-label="Координатна площина. Вектор a ${pair(a)}, вектор b ${pair(b)}. Координати можна змінити повзунками нижче.">${arrowDefs()}${grid}<path d="M53 164H350M200 312V15" fill="none" stroke="#b9abc9" stroke-width="1.2"/>${svgt(354,168,'x')}${svgt(207,20,'y')}${svgt(187,178,'0','#8d7fa0',10)}${arrows}${handle(ax,ay,'a','#7357e8')}${handle(bx,by,'b','#e78d4d')}${svgt(clamp(ax+10,20,375),clamp(ay+18,20,319),'a','#7357e8',15)}${svgt(clamp(bx+10,20,375),clamp(by-10,18,319),'b','#d17c40',15)}</svg>`;
}
function vectorPanel(){return `<div class="seg" aria-label="Операція над векторами">${[['sum','Сума'],['diff','Різниця'],['dot','Добуток і кут']].map(([id,label])=>`<button class="${UI.vectorMode===id?'active':''}" data-action="vectorMode" data-value="${id}">${label}</button>`).join('')}</div><div class="card lab-card"><div id="vectorStage" style="touch-action:none"></div><p class="fine center">Рухай кольорові точки або змінюй координати повзунками.</p><div id="vectorFormula"></div><div class="lab-metrics" id="vectorMetrics"></div>${['a','b'].map((key,i)=>`<div class="range-row"><div class="range-label"><span style="color:${i?'#d17c40':'var(--purple)'}">Вектор ${key}</span><span id="${key}Pair"></span></div><div class="ranges">${['x','y'].map((axis,j)=>`<div class="range-cell"><label for="range-${key}${axis}">${axis}</label><input type="range" id="range-${key}${axis}" min="-5" max="5" step="1" value="${UI[key][j]}" data-range="${key}${axis}" aria-label="Координата ${axis} вектора ${key}"></div>`).join('')}</div></div>`).join('')}<div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" data-action="vectorPreset" data-value="perp">Перпендикулярні</button><button class="btn ghost sm" data-action="vectorPreset" data-value="opposite">Протилежні</button><button class="btn ghost sm" data-action="vectorPreset" data-value="zero">Нульовий вектор</button></div><div id="vectorNote"></div></div>`;}
function updateVector(){if(!$('#vectorStage'))return;$('#vectorStage').innerHTML=vectorSVG();const i=vectorInfo(UI.a,UI.b),r=UI.vectorMode==='diff'?i.diff:i.sum;$('#aPair').textContent=pair(UI.a);$('#bPair').textContent=pair(UI.b);$('#vectorFormula').innerHTML=form(UI.vectorMode==='dot'?`a · b = ${fmt(UI.a[0])} · ${UI.b[0]<0?'('+fmt(UI.b[0])+')':fmt(UI.b[0])} + ${UI.a[1]<0?'('+fmt(UI.a[1])+')':fmt(UI.a[1])} · ${UI.b[1]<0?'('+fmt(UI.b[1])+')':fmt(UI.b[1])} = ${fmt(i.dot)}`:`a ${UI.vectorMode==='sum'?'+':'−'} b = ${pair(r)}`);$('#vectorMetrics').innerHTML=`<div class="metric">${UI.vectorMode==='diff'?'Довжина різниці':'Довжина суми'}<strong>${fmt(Math.hypot(...r))}</strong></div><div class="metric">Скалярний добуток<strong>${fmt(i.dot)}</strong></div><div class="metric">Довжини a та b<strong>${fmt(i.la)} · ${fmt(i.lb)}</strong></div><div class="metric">Кут між a та b<strong>${i.angle===null?'Не визначений':fmt(i.angle,1)+'°'}</strong></div>`;$('#vectorNote').innerHTML=note(!i.la||!i.lb?'Нульовий вектор не має визначеного напряму, тому кут із ним не обчислюємо.':i.perpendicular?'Скалярний добуток дорівнює 0. Ненульові вектори перпендикулярні.':i.collinear?'Вектори колінеарні: лежать на одній або паралельних прямих.':UI.vectorMode==='dot'?'Косинус кута = скалярний добуток / добуток довжин.':'Зелена стрілка показує результат операції. Довжина результату може відрізнятися від суми довжин.');}

const TRI_MODES={sas:{title:'Дві сторони й кут',labels:['b, см','c, см','α, °'],values:['5','8','60']},asa:{title:'Сторона й два кути',labels:['a, см','α, °','β, °'],values:['10','30','45']},sss:{title:'Три сторони',labels:['a, см','b, см','c, см'],values:['13','14','15']},ssa:{title:'Дві сторони й кут навпроти',labels:['a, см','b, см','α, °'],values:['6','6√2','30']}};
function triangleSVG(t){const C=[t.b*Math.cos(rad(t.A)),t.b*Math.sin(rad(t.A))],minX=Math.min(0,C[0]),maxX=Math.max(t.c,C[0]),scale=Math.min(310/(maxX-minX),175/C[1]),offset=45+(310-(maxX-minX)*scale)/2,pt=p=>[offset+(p[0]-minX)*scale,221-p[1]*scale],A=pt([0,0]),B=pt([t.c,0]),P=pt(C),H=pt([C[0],0]),cent=[(A[0]+B[0]+P[0])/3,(A[1]+B[1]+P[1])/3];
 const side=(p,q,label)=>{const mid=[(p[0]+q[0])/2,(p[1]+q[1])/2];let dx=q[1]-p[1],dy=p[0]-q[0],len=Math.hypot(dx,dy);dx/=len;dy/=len;if((mid[0]-cent[0])*dx+(mid[1]-cent[1])*dy<0){dx=-dx;dy=-dy;}return svgt(clamp(mid[0]+dx*15,35,365),clamp(mid[1]+dy*15,19,255),label,'#66577d',12,'text-anchor="middle"');};
 const angleLabel=(v,p,q,label)=>{const lp=Math.hypot(p[0]-v[0],p[1]-v[1]),lq=Math.hypot(q[0]-v[0],q[1]-v[1]);let dx=(p[0]-v[0])/lp+(q[0]-v[0])/lq,dy=(p[1]-v[1])/lp+(q[1]-v[1])/lq;const l=Math.hypot(dx,dy)||1;return svgt(v[0]+dx/l*24,v[1]+dy/l*24,label,'#a396b2',13,'text-anchor="middle"');};
 return `<svg class="lab-svg" viewBox="0 0 400 280" role="img" aria-label="Трикутник ABC зі сторонами a ${fmt(t.a)}, b ${fmt(t.b)}, c ${fmt(t.c)} та кутами α ${fmt(t.A,1)}, β ${fmt(t.B,1)}, γ ${fmt(t.C,1)} градусів"><path d="M${A}L${B}L${P}Z" fill="#f1ecff" stroke="#7357e8" stroke-width="2.7"/>${line(...P,...H,'#d6a075','stroke-dasharray="5 5" stroke-width="1.5"')}${svgt(A[0]-17,A[1]+5,'A','#7357e8',15)}${svgt(B[0]+9,B[1]+5,'B','#7357e8',15)}${svgt(P[0],P[1]-12,'C','#7357e8',15,'text-anchor="middle"')}${side(B,P,'a = '+fmt(t.a))}${side(A,P,'b = '+fmt(t.b))}${side(A,B,'c = '+fmt(t.c))}${angleLabel(A,B,P,'α')}${angleLabel(B,A,P,'β')}${angleLabel(P,A,B,'γ')}</svg>`;
}
function answerTools(){return '<div class="row answer-tools" style="justify-content:center;margin:9px 0 15px;gap:9px"><button class="btn ghost sm" data-action="mathKey" data-key="−" aria-label="Вставити мінус">−</button><button class="btn ghost sm" data-action="mathKey" data-key="√" aria-label="Вставити квадратний корінь">√</button><button class="btn ghost sm" data-action="mathKey" data-key="/" aria-label="Вставити знак дробу">/</button></div>';}
function trianglePanel(){const mode=TRI_MODES[UI.triangleMode];return `<div class="card lab-card" style="margin-top:18px"><label for="triangleMode" class="small" style="font-weight:800">Що відомо?</label><select id="triangleMode" class="field" style="margin-top:8px;font-size:14px">${Object.entries(TRI_MODES).map(([id,v])=>`<option value="${id}" ${id===UI.triangleMode?'selected':''}>${v.title}</option>`).join('')}</select><div class="lab-form">${mode.labels.map((label,i)=>`<div><label for="tri${i}">${label}</label><input id="tri${i}" class="field tri-input" data-index="${i}" value="${esc(UI.triangleInputs[i])}" inputmode="decimal" autocomplete="off" spellcheck="false"></div>`).join('')}</div>${answerTools()}<p class="fine">Кути — у градусах. Довжини можна вводити дробами та з коренями.</p><div id="triangleOutput" aria-live="polite"></div></div>`;}
function updateTriangle(){const out=$('#triangleOutput');if(!out)return;const values=UI.triangleInputs.map(parseNumber);if(values.some(n=>!Number.isFinite(n))){out.innerHTML='<div class="hint">Введи всі три величини. Приклади запису: 8,5; 6√2; 13/2.</div>';return;}const result=solveTriangle(UI.triangleMode,values);if(result.error){out.innerHTML=`<div class="feedback bad"><h3>Перевір дані</h3><p>${esc(result.error)}</p></div>`;return;}UI.triangleVariant=clamp(UI.triangleVariant,0,result.solutions.length-1);const t=result.solutions[UI.triangleVariant];let steps='';
 if(UI.triangleMode==='sas')steps=`<div class="lab-step"><b>1. Теорема косинусів</b><br>a² = ${fmt(t.b)}² + ${fmt(t.c)}² − 2 · ${fmt(t.b)} · ${fmt(t.c)} · cos ${fmt(t.A,1)}° = ${fmt(t.a*t.a)}<br>a = ${fmt(t.a)} см</div><div class="lab-step"><b>2. Ще один кут</b><br>cos β = (a² + c² − b²) / (2ac)<br>β = ${fmt(t.B,1)}°</div><div class="lab-step"><b>3. Сума кутів</b><br>γ = 180° − α − β = ${fmt(t.C,1)}°</div>`;
 else if(UI.triangleMode==='asa')steps=`<div class="lab-step"><b>1. Третій кут</b><br>γ = 180° − ${fmt(t.A,1)}° − ${fmt(t.B,1)}° = ${fmt(t.C,1)}°</div><div class="lab-step"><b>2. Теорема синусів</b><br>b = a · sin β / sin α = ${fmt(t.b)} см<br>c = a · sin γ / sin α = ${fmt(t.c)} см</div>`;
 else if(UI.triangleMode==='sss')steps=`<div class="lab-step"><b>1. Перевірка існування</b><br>Сума двох менших сторін більша за найбільшу.</div><div class="lab-step"><b>2. Теорема косинусів</b><br>cos α = (b² + c² − a²) / (2bc)<br>α = ${fmt(t.A,1)}°, β = ${fmt(t.B,1)}°</div><div class="lab-step"><b>3. Третій кут</b><br>γ = 180° − α − β = ${fmt(t.C,1)}°</div>`;
 else steps=`<div class="lab-step"><b>1. Теорема синусів</b><br>sin β = b · sin α / a = ${fmt(values[1]*Math.sin(rad(values[2]))/values[0],4)}</div><div class="lab-step"><b>2. Перевірка можливих кутів</b><br>${result.solutions.length===2?'Обидва кути β та 180° − β допустимі. Є два різні трикутники.':'Після перевірки суми кутів маємо один трикутник.'}</div><div class="lab-step"><b>3. Вибраний варіант</b><br>β = ${fmt(t.B,1)}°, γ = ${fmt(t.C,1)}°<br>c = a · sin γ / sin α = ${fmt(t.c)} см</div>`;
 out.innerHTML=`${result.solutions.length>1?`<div class="note peach"><b>Існує два трикутники.</b> Перемкни варіант і порівняй форму.</div><div class="seg">${result.solutions.map((z,i)=>`<button data-action="variant" data-index="${i}" class="${UI.triangleVariant===i?'active':''}">Варіант ${i+1} · β ${fmt(z.B,1)}°</button>`).join('')}</div>`:''}${triangleSVG(t)}<table class="mini-table"><tr><th>a</th><th>b</th><th>c</th></tr><tr><td style="text-align:center">${fmt(t.a)} см</td><td>${fmt(t.b)} см</td><td>${fmt(t.c)} см</td></tr><tr><th>α</th><th>β</th><th>γ</th></tr><tr><td style="text-align:center">${fmt(t.A,1)}°</td><td>${fmt(t.B,1)}°</td><td>${fmt(t.C,1)}°</td></tr></table><div class="lab-metrics"><div class="metric">Площа S<strong>${fmt(t.S)} см²</strong></div><div class="metric">Півпериметр p<strong>${fmt(t.p)} см</strong></div><div class="metric">Вписане коло r<strong>${fmt(t.r)} см</strong></div><div class="metric">Описане коло R<strong>${fmt(t.R)} см</strong></div></div><h3 style="margin-top:18px">Як отримано результат</h3>${steps}<div class="lab-step"><b>Площа та кола</b><br>S = ½bc · sin α = ${fmt(t.S)} см²<br>r = S/p = ${fmt(t.r)} см<br>R = abc/(4S) = ${fmt(t.R)} см</div><p class="fine">На малюнку позначено висоту з C. Усі обчислення виконано до округлення результатів.</p>`;
}
function renderLab(){$('#main').innerHTML=`<p class="eyebrow">Змінюй дані та спостерігай</p><h1>Геометрична майстерня</h1><div class="seg"><button class="${UI.tab==='v'?'active':''}" data-action="labTab" data-value="v">↗ Вектори</button><button class="${UI.tab==='t'?'active':''}" data-action="labTab" data-value="t">△ Трикутники</button></div>${UI.tab==='v'?vectorPanel():trianglePanel()}`;if(UI.tab==='v')updateVector();else updateTriangle();}

function customQuiz(pool,mode='topic',unit){UI.session={mode,unit,questions:shuffle(pool),index:0,correct:0,answered:0,xp:0,wrong:[],options:{}};for(const q of pool)if(q.type==='choice')UI.session.options[q.id]=shuffle(q.choices.map((_,i)=>i));resetQuestion();go('quiz');}
function exportProgress(){const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='geoq-progress-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Копію прогресу підготовлено для збереження.');}
function bindEvents(){
 document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
  if(a==='home'){go('home');}
  else if(a==='help'){go('help');}
  else if(a==='nav'){go(b.dataset.screen);}
  else if(a==='course'){go('course',{topic:b.dataset.topic??UI.topic});}
  else if(a==='lesson'){const unit=b.dataset.unit;if(!UNITS.some(u=>u.id===unit))return;STATE.lastUnit=unit;saveState();go('lesson',{unit,slide:0,proofStep:0});}
  else if(a==='nextSlide'||a==='prevSlide'){UI.slide+=a==='nextSlide'?1:-1;UI.proofStep=0;renderLesson();window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
  else if(a==='proofNext'||a==='proofPrev'){const y=window.scrollY;UI.proofStep=clamp(UI.proofStep+(a==='proofNext'?1:-1),0,6);renderLesson();window.scrollTo(0,y);}
  else if(a==='finishLesson'){markRead(UI.unit);startQuiz('unit',UI.unit);}
  else if(a==='unitPractice'){startQuiz('unit',b.dataset.unit);}
  else if(a==='quiz'){startQuiz(b.dataset.mode??'daily',b.dataset.unit);}
  else if(a==='topicQuiz'){customQuiz(shuffle(BANK.filter(q=>q.unit.startsWith(b.dataset.topic))).slice(0,12),'topic');}
  else if(a==='select'&&!UI.checked){UI.selected=Number(b.dataset.index);document.querySelectorAll('.option').forEach(el=>{const on=Number(el.dataset.index)===UI.selected;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on));});$('#checkBtn').disabled=false;$('#answerError').textContent='';}
  else if(a==='check'){checkAnswer();}
  else if(a==='hint'&&!UI.checked){UI.usedHint=true;const q=UI.session.questions[UI.session.index];$('#hintArea').innerHTML=`<div class="hint">${esc(q.hint)}</div>`;b.disabled=true;b.textContent='Підказка відкрита';}
  else if(a==='nextQuestion'){nextQuestion();}
  else if(a==='exitQuiz'){UI.session=null;go('home');toast('Уже перевірені відповіді збережено.');}
  else if(a==='retry'){const ids=[...new Set(UI.session.wrong)],unit=UI.session.unit;customQuiz(ids.map(id=>BANK.find(q=>q.id===id)).filter(Boolean),'retry',unit);}
  else if(a==='labTab'){go('lab',{tab:b.dataset.value});}
  else if(a==='vectorMode'){UI.vectorMode=b.dataset.value;renderLab();}
  else if(a==='vectorPreset'){const presets={perp:[[3,-2],[2,3]],opposite:[[2,3],[-2,-3]],zero:[[0,0],[2,3]]};[UI.a,UI.b]=presets[b.dataset.value].map(a=>a.slice());renderLab();}
  else if(a==='variant'){UI.triangleVariant=Number(b.dataset.index);updateTriangle();}
  else if(a==='mathKey'){
   const input=document.getElementById(UI.lastInput??'')??document.querySelector('.answer-input:not(:disabled),.tri-input');if(!input||input.disabled)return;
   const key=b.dataset.key,start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.focus();input.setRangeText(key,start,end,'end');input.dispatchEvent(new Event('input',{bubbles:true}));
  }
  else if(a==='sound'){STATE.sound=!STATE.sound;saveState();renderHelp();if(STATE.sound)playTone(true);}
  else if(a==='export'){exportProgress();}
  else if(a==='import'){$('#importFile').click();}
  else if(a==='reset'){if(confirm('Очистити весь навчальний прогрес у цьому браузері? Для збереження результатів спочатку експортуй копію.')){STATE=newState();saveState();UI.session=null;go('home');toast('Прогрес очищено.');}}
 });
 document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-range]')){const key=t.dataset.range;UI[key[0]][key[1]==='x'?0:1]=Number(t.value);updateVector();}
  else if(t.matches('.tri-input')){UI.triangleInputs[Number(t.dataset.index)]=t.value;UI.triangleVariant=0;updateTriangle();}
  else if(t.matches('.answer-input')){UI.inputCache=[...document.querySelectorAll('.answer-input')].map(i=>i.value);const er=$('#answerError');if(er)er.textContent='';}
 });
 document.addEventListener('focusin',e=>{if(e.target.matches('.answer-input,.tri-input'))UI.lastInput=e.target.id;});
 document.addEventListener('change',e=>{if(e.target.id==='triangleMode'){UI.triangleMode=e.target.value;UI.triangleInputs=TRI_MODES[UI.triangleMode].values.slice();UI.triangleVariant=0;renderLab();}});
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&UI.screen==='quiz'&&!UI.checked&&e.target.matches('.answer-input')){e.preventDefault();checkAnswer();}});
 document.addEventListener('pointerdown',e=>{
  const handle=e.target.closest('[data-drag]');if(!handle||UI.screen!=='lab'||UI.tab!=='v')return;e.preventDefault();const key=handle.dataset.drag,other=UI[key==='a'?'b':'a'];UI.drag={key,pointerId:e.pointerId,extent:Math.max(6,...other.map(n=>Math.abs(n)+5))+1};const stage=$('#vectorStage');stage.setPointerCapture(e.pointerId);updateVector();
 });
 document.addEventListener('pointermove',e=>{
  if(!UI.drag||UI.drag.pointerId!==e.pointerId)return;e.preventDefault();const svg=$('#vectorSvg');if(!svg)return;const box=svg.getBoundingClientRect(),x=(e.clientX-box.left)/box.width*400,y=(e.clientY-box.top)/box.height*330,scale=140/UI.drag.extent;
  UI[UI.drag.key]=[clamp(Math.round((x-200)/scale),-5,5),clamp(Math.round((164-y)/scale),-5,5)];const key=UI.drag.key;for(let j=0;j<2;j++){const range=document.getElementById('range-'+key+(j===0?'x':'y'));if(range)range.value=UI[key][j];}updateVector();
 },{passive:false});
 const endDrag=e=>{if(!UI.drag||UI.drag.pointerId!==e.pointerId)return;try{$('#vectorStage')?.releasePointerCapture(e.pointerId);}catch{}UI.drag=null;updateVector();};document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
 $('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('Завеликий файл');const state=cleanState(JSON.parse(await file.text()));if(confirm('Замінити поточний прогрес даними з вибраної копії?')){STATE=state;saveState();UI.session=null;go('progress');toast('Прогрес імпортовано.');}}catch{toast('Не вдалося прочитати копію прогресу ГеоКвесту.');}e.target.value='';});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){resetDay();if(['home','review','progress'].includes(UI.screen))render();}});
 window.addEventListener('pagehide',saveState);
}
if(typeof document!=='undefined')boot();
